<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1540" viewBox="0 0 1240 1540" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">科研三端协作：云端、本地、多服务器</title><desc id="diagram-desc">三层结构：上层 GitHub 保存代码版本，中层本地电脑通过 VS Code、Codex 和 WSL2 进行开发，下层课题组的 EDA、GPU 和其他服务器按任务执行计算。源码向下上传，状态与小型结果向上回传。</desc><defs><marker id="purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#7046BC"/></marker><marker id="blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#2458A6"/></marker><marker id="green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087F70"/></marker></defs><g font-family="Arial, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect data-id="artboard" x="0" y="0" width="1240" height="1540" rx="0" fill="#FBFCFE" stroke="#FBFCFE" stroke-width="0"/>
